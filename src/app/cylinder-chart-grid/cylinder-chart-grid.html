<div class="chart-row">
  <app-cylinder-chart-box
    [seriesConfig]="physicalSeriesConfig"
    [data]="physicalData()"
    unit="RPM"
    [width]="300"
    [height]="160"
  />
  <app-cylinder-chart-box
    [seriesConfig]="discreteSeriesConfig"
    [data]="discreteData()"
    [width]="300"
    [height]="160"
  />
</div>
